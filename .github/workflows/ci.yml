name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libnode-dev libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libuv1-dev libicu-dev zlib1g-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - uses: r-lib/actions/setup-renv@v2
      - name: tests
        run: Rscript -e "testthat::test_dir('tests/testthat', stop_on_failure = TRUE)"

  live:
    name: live run on 2024 EPA files
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      R_CONFIG_ACTIVE: live
    steps:
      - uses: actions/checkout@v5
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libnode-dev libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libuv1-dev libicu-dev zlib1g-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - uses: r-lib/actions/setup-renv@v2
      - name: pipeline
        run: Rscript -e "targets::tar_make()"
      - name: match rates
        run: Rscript -e "targets::tar_source(); con <- open_warehouse(); print(DBI::dbGetQuery(con, 'select level, status, sum(n) as n from recon_summary group by all order by all'))"
      - name: second run rebuilds nothing
        run: Rscript -e "targets::tar_make(); p <- targets::tar_progress(); stopifnot(all(p$progress[p$name != 'remote_index'] == 'skipped'))"
